name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:m04
      - run: pnpm verify:m05
      - run: pnpm verify:m06
      - run: pnpm verify:m07
      - run: pnpm db:up && pnpm db:wait && pnpm db:migrate
      - run: pnpm verify:m08
      - run: pnpm verify:m09
      - run: pnpm verify:m10
      - run: pnpm verify:m11
      - run: pnpm verify:m12
      - run: pnpm verify:m13
      - run: pnpm verify:m14
      - run: pnpm verify:m15
      - run: pnpm verify:m16
      - run: pnpm verify:m17
      - run: pnpm verify:m18
      - run: pnpm verify:m19
      - run: pnpm db:up && pnpm db:wait && pnpm db:migrate
      - run: pnpm verify:m21
  verify-m19-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [netsons, aws]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:m19
        env:
          KIVRO_CLOUD_PROFILE: ${{ matrix.profile }}
  verify-m21-aws-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kivro/cloud-aws run build
      - run: node scripts/aws-deploy-preflight.mjs
        env:
          KIVRO_CLOUD_PROFILE: aws
          DATABASE_URL: postgresql://kivro:kivro@localhost:5433/kivro
