name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:m04
      - run: pnpm verify:m05
      - run: pnpm verify:m06
      - run: pnpm verify:m07
      - run: pnpm db:up && pnpm db:wait && pnpm db:migrate
      - run: pnpm verify:m08
      - run: pnpm verify:m09
      - run: pnpm verify:m10
      - run: pnpm verify:m11
