# Local dev infrastructure (M18). Postgres uses host port 5433
# to avoid clashing with other PostgreSQL instances on 5432.
services:
  redis:
    image: redis:7-alpine
    container_name: kivro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kivro-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kivro
      MINIO_ROOT_PASSWORD: kivrodevsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kivro_minio_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: kivro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kivro
      POSTGRES_PASSWORD: kivro
      POSTGRES_DB: kivro
    ports:
      - "5433:5432"
    volumes:
      - kivro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivro -d kivro"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  kivro_pg_data:
  kivro_minio_data:
