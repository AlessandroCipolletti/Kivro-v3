# Local dev infrastructure (M18).
# Host ports sit beside Arcads (Postgres 5432, Redis 6379) and Boostrad
# (Postgres 5433, Redis 6380, MinIO 9000/9001). Container ports stay standard.
services:
  redis:
    image: redis:7-alpine
    container_name: kivro-redis
    restart: unless-stopped
    ports:
      - "${KIVRO_REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kivro-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kivro
      MINIO_ROOT_PASSWORD: kivrodevsecret
    ports:
      - "${KIVRO_MINIO_API_PORT:-9002}:9000"
      - "${KIVRO_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - kivro_minio_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: kivro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kivro
      POSTGRES_PASSWORD: kivro
      POSTGRES_DB: kivro
    ports:
      - "${KIVRO_POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - kivro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivro -d kivro"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  kivro_pg_data:
  kivro_minio_data:
